      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0505"/>
    </linearGradient>
    <linearGradient id="goldGrad_13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFF2A3"/>
    </linearGradient>
    <pattern id="grid_13" width="40" height="40" patternUnits="userSpaceOnUse">
