    <text x="18" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">✓ 25 Deadly Interview Flaw</text>

    <rect x="240" y="0" width="245" height="46" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
