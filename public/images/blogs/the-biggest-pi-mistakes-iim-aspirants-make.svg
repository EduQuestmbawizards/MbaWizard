    <tspan x="80" dy="54">s Make</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1" width="700">
